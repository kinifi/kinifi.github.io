---
layout: default
title: Projects — Christopher Figueroa Braff
---
<h1>projects</h1>

<div class="grid">
  {% assign sorted_projects = site.projects | sort: "order" %}
  {% for project in sorted_projects %}
  <div class="box box--{{ project.color | default: 'green' }}">
    <span class="tab">{{ project.tag }}</span>
    <p><a href="{{ project.url }}">{{ project.title }}</a></p>
    <p class="meta">{{ project.content | strip_html | strip }}</p>
  </div>
  {% endfor %}
</div>
