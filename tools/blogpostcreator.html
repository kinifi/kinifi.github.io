<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Post Creator</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: 'Courier New', monospace;
    background: #0a0f0a;
    color: #d7f7de;
  }
  body { display: flex; flex-direction: column; height: 100vh; }
  header {
    padding: 12px 20px;
    border-bottom: 1px solid #1f8f43;
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1rem; margin: 0; color: #39ff6a; white-space: nowrap; }
  label { font-size: 0.8rem; color: #6f9c7a; display: flex; align-items: center; gap: 6px; }
  input[type=text], input[type=date] {
    background: #050e08;
    border: 1px solid #1f8f43;
    color: #d7f7de;
    font-family: inherit;
    font-size: 0.85rem;
    padding: 5px 8px;
  }
  #title { flex: 1; min-width: 200px; }
  select {
    background: #050e08;
    border: 1px solid #1f8f43;
    color: #d7f7de;
    font-family: inherit;
    font-size: 0.85rem;
    padding: 5px 8px;
  }
  .meta-row {
    display: flex;
    gap: 16px;
    padding: 8px 20px;
    border-bottom: 1px solid #1f8f43;
    flex-wrap: wrap;
    align-items: center;
  }
  body.type-post .field-project { display: none; }
  body.type-project .field-post { display: none; }
  #order { width: 50px; }
  #github { min-width: 240px; }
  button {
    font-family: inherit;
    font-size: 0.85rem;
    background: transparent;
    border: 1px solid #39ff6a;
    color: #39ff6a;
    padding: 6px 14px;
    cursor: pointer;
  }
  button:hover { background: #39ff6a; color: #001a06; }
  .connect-status { font-size: 0.78rem; color: #6f9c7a; white-space: nowrap; }
  .connect-status.connected { color: #39ff6a; }
  .connect-hint { font-size: 0.75rem; color: #6f9c7a; }
  .connect-hint code {
    background: #0d1a0d;
    color: #d7f7de;
    padding: 1px 4px;
    font-family: inherit;
  }
  .toast {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 100;
    background: #001a06;
    border: 1px solid #39ff6a;
    color: #39ff6a;
    padding: 10px 18px;
    font-size: 0.85rem;
    box-shadow: 0 0 14px rgba(57, 255, 106, 0.45);
    opacity: 1;
    transition: opacity 0.3s ease;
  }
  .toast.error { border-color: #ff5c5c; color: #ff5c5c; box-shadow: 0 0 14px rgba(255, 92, 92, 0.45); }
  .toast.hide { opacity: 0; }
  .toolbar {
    display: flex;
    gap: 6px;
    padding: 8px 20px;
    border-bottom: 1px solid #1f8f43;
    flex-wrap: wrap;
  }
  .toolbar button {
    font-size: 0.75rem;
    padding: 4px 10px;
    border-color: #6f9c7a;
    color: #d7f7de;
  }
  .toolbar button:hover { background: #6f9c7a; color: #001a06; }
  main { flex: 1; display: flex; min-height: 0; }
  .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .pane + .pane { border-left: 1px solid #1f8f43; }
  .pane-label {
    font-size: 0.7rem;
    color: #6f9c7a;
    padding: 6px 12px;
    border-bottom: 1px solid #16241a;
  }
  textarea {
    flex: 1;
    resize: none;
    border: none;
    background: #060a06;
    color: #d7f7de;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    padding: 14px;
    outline: none;
    line-height: 1.5;
  }
  #preview { flex: 1; overflow-y: auto; padding: 14px 20px; line-height: 1.6; }
  #preview h1, #preview h2, #preview h3 { color: #39ff6a; }
  #preview code { background: #0d1a0d; padding: 1px 5px; }
  #preview pre { background: #0d1a0d; padding: 10px; overflow-x: auto; }
  #preview pre code { padding: 0; }
  #preview hr { border: none; border-top: 1px dashed #1f8f43; margin: 16px 0; }
  #preview blockquote { border-left: 2px solid #1f8f43; margin: 0; padding-left: 12px; color: #6f9c7a; }
  #preview a { color: #4dd8ff; }
  #preview img { max-width: 100%; }
  #status {
    padding: 6px 20px;
    font-size: 0.75rem;
    color: #6f9c7a;
    border-top: 1px solid #16241a;
    min-height: 18px;
  }
</style>
</head>
<body>
  <header>
    <h1>post creator</h1>
    <label>type
      <select id="postType">
        <option value="post">blog post</option>
        <option value="project">project post</option>
      </select>
    </label>
    <label>title <input type="text" id="title" placeholder="Post Title"></label>
    <button id="openBtn" type="button">open post/project</button>
    <button id="createBtn">create post</button>
    <button id="connectBtn" type="button">connect repo folder</button>
    <span class="connect-hint">select the <code>kinifi.github.io</code> folder itself — not <code>_posts</code> or <code>_projects</code></span>
    <span id="connectStatus" class="connect-status">not connected</span>
  </header>
  <div class="meta-row">
    <label class="field-post">date <input type="date" id="date"></label>
    <label class="field-project">tag <input type="text" id="tag" placeholder="unity"></label>
    <label class="field-project">
      color
      <select id="color">
        <option>green</option>
        <option>pink</option>
        <option>yellow</option>
        <option>orange</option>
        <option>purple</option>
        <option>cyan</option>
      </select>
    </label>
    <label class="field-project">order <input type="text" id="order" placeholder="14"></label>
    <label class="field-project">github <input type="text" id="github" placeholder="https://github.com/kinifi/..."></label>
  </div>
  <div id="toast" class="toast" hidden></div>
  <div class="toolbar">
    <button type="button" data-action="h1">H1</button>
    <button type="button" data-action="h2">H2</button>
    <button type="button" data-action="h3">H3</button>
    <button type="button" data-action="bold"><b>B</b></button>
    <button type="button" data-action="italic"><i>I</i></button>
    <button type="button" data-action="code">code</button>
    <button type="button" data-action="link">link</button>
    <button type="button" data-action="image">image</button>
    <button type="button" data-action="ul">list</button>
    <button type="button" data-action="quote">quote</button>
    <button type="button" data-action="hr">hr</button>
  </div>
  <main>
    <div class="pane">
      <div class="pane-label">markdown</div>
      <textarea id="editor" placeholder="Write your post here..." spellcheck="false"></textarea>
    </div>
    <div class="pane">
      <div class="pane-label">preview</div>
      <div id="preview"></div>
    </div>
  </main>
  <div id="status"></div>

<script>
// ---- tiny markdown renderer (just enough for these posts) ----
function renderMarkdown(src) {
  function escape(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function inline(text) {
    text = escape(text);
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    text = text.replace(/_([^_]+)_/g, '<em>$1</em>');
    text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');
    text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return text;
  }

  var lines = src.replace(/\r\n/g, '\n').split('\n');
  var html = [];
  var inCode = false, codeBuf = [];
  var listType = null, listBuf = [];

  function flushList() {
    if (listType) {
      html.push('<' + listType + '>' + listBuf.join('') + '</' + listType + '>');
      listType = null;
      listBuf = [];
    }
  }

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];

    if (/^```/.test(line)) {
      if (!inCode) { inCode = true; codeBuf = []; }
      else { html.push('<pre><code>' + escape(codeBuf.join('\n')) + '</code></pre>'); inCode = false; }
      continue;
    }
    if (inCode) { codeBuf.push(line); continue; }

    if (/^\s*$/.test(line)) { flushList(); continue; }

    var h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { flushList(); html.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'); continue; }

    if (/^(\*\s*\*\s*\*|-{3,}|_{3,})\s*$/.test(line)) { flushList(); html.push('<hr>'); continue; }

    var bq = line.match(/^>\s?(.*)$/);
    if (bq) { flushList(); html.push('<blockquote>' + inline(bq[1]) + '</blockquote>'); continue; }

    var ul = line.match(/^[-*]\s+(.*)$/);
    if (ul) {
      if (listType !== 'ul') { flushList(); listType = 'ul'; }
      listBuf.push('<li>' + inline(ul[1]) + '</li>');
      continue;
    }
    var ol = line.match(/^\d+\.\s+(.*)$/);
    if (ol) {
      if (listType !== 'ol') { flushList(); listType = 'ol'; }
      listBuf.push('<li>' + inline(ol[1]) + '</li>');
      continue;
    }

    flushList();
    html.push('<p>' + inline(line) + '</p>');
  }
  flushList();
  return html.join('\n');
}

var editor = document.getElementById('editor');
var preview = document.getElementById('preview');
var titleInput = document.getElementById('title');
var dateInput = document.getElementById('date');
var postType = document.getElementById('postType');
var tagInput = document.getElementById('tag');
var colorInput = document.getElementById('color');
var orderInput = document.getElementById('order');
var githubInput = document.getElementById('github');
var status = document.getElementById('status');
var toast = document.getElementById('toast');
var toastTimer = null;

function showToast(message, isError) {
  toast.textContent = message;
  toast.hidden = false;
  toast.classList.toggle('error', !!isError);
  toast.classList.remove('hide');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () {
    toast.classList.add('hide');
    setTimeout(function () { toast.hidden = true; }, 300);
  }, 3000);
}

function update() { preview.innerHTML = renderMarkdown(editor.value); }
editor.addEventListener('input', update);

function applyTypeVisibility() { document.body.className = 'type-' + postType.value; }
postType.addEventListener('change', applyTypeVisibility);
applyTypeVisibility();

dateInput.value = new Date().toISOString().slice(0, 10);
update();

// ---- toolbar: wrap or prefix the current selection ----
function wrapSelection(before, after, placeholder) {
  var start = editor.selectionStart;
  var end = editor.selectionEnd;
  var value = editor.value;
  var selected = value.slice(start, end);
  var body = selected || (placeholder || '');
  var insertText = before + body + after;

  editor.value = value.slice(0, start) + insertText + value.slice(end);
  editor.focus();
  if (selected) {
    editor.setSelectionRange(start + before.length, start + before.length + selected.length);
  } else {
    editor.setSelectionRange(start + before.length, start + before.length + body.length);
  }
  update();
}

function prefixLines(prefix) {
  var start = editor.selectionStart;
  var end = editor.selectionEnd;
  var value = editor.value;
  var lineStart = value.lastIndexOf('\n', start - 1) + 1;
  var lineEnd = value.indexOf('\n', end);
  if (lineEnd === -1) lineEnd = value.length;

  var block = value.slice(lineStart, lineEnd);
  var newBlock = block.split('\n').map(function (l) { return prefix + l; }).join('\n');

  editor.value = value.slice(0, lineStart) + newBlock + value.slice(lineEnd);
  editor.focus();
  editor.setSelectionRange(lineStart, lineStart + newBlock.length);
  update();
}

function insertAtCursor(text) {
  var start = editor.selectionStart;
  var end = editor.selectionEnd;
  var value = editor.value;
  editor.value = value.slice(0, start) + text + value.slice(end);
  var pos = start + text.length;
  editor.focus();
  editor.setSelectionRange(pos, pos);
  update();
}

// Everything the tool writes (posts, projects, images) goes into the same
// repo checkout. "connect repo folder" is the ONE place that ever calls
// showDirectoryPicker — every other action just uses the cached handle,
// so no action ever has to chain two native dialogs in one click (Chrome
// silently kills the 2nd dialog once the click's "user activation" expires,
// which is why an earlier version of this tool could silently fail).
var siteRootHandle = null;
var connectBtn = document.getElementById('connectBtn');
var connectStatus = document.getElementById('connectStatus');

async function connectRepo() {
  try {
    siteRootHandle = await window.showDirectoryPicker({ id: 'kinifi-site-root', startIn: 'documents' });
    connectStatus.textContent = 'connected: ' + siteRootHandle.name;
    connectStatus.classList.add('connected');
    status.textContent = 'connected to ' + siteRootHandle.name + ' — create post / insert image will now save automatically.';
  } catch (err) {
    if (err.name !== 'AbortError') status.textContent = 'could not connect: ' + err.message;
  }
}
connectBtn.addEventListener('click', connectRepo);

async function getSubDir(root, path) {
  var dir = root;
  var parts = path.split('/').filter(function (p) { return p.length > 0; });
  for (var i = 0; i < parts.length; i++) {
    dir = await dir.getDirectoryHandle(parts[i], { create: true });
  }
  return dir;
}

async function insertImage() {
  if (!window.showOpenFilePicker || !window.showDirectoryPicker) {
    var name = prompt('Image filename (you\'ll need to add it to assets/img/ yourself):', 'photo.png');
    if (name) insertAtCursor('![](/assets/img/' + name + ')');
    return;
  }

  if (!siteRootHandle) {
    alert('Click "connect repo folder" first (top right), then try inserting the image again.');
    return;
  }

  var dir;
  try {
    dir = await getSubDir(siteRootHandle, 'assets/img');
  } catch (err) {
    status.textContent = 'could not open assets/img/: ' + err.message;
    return;
  }

  var picked;
  try {
    picked = await window.showOpenFilePicker({
      types: [{ description: 'Images', accept: { 'image/*': ['.png', '.jpg', '.jpeg', '.gif', '.svg', '.webp'] } }]
    });
  } catch (err) {
    return; // user cancelled picking the source image
  }
  var file = await picked[0].getFile();
  var alt = prompt('Alt text for this image:', file.name.replace(/\.[^.]+$/, '')) || '';

  try {
    var targetHandle = await dir.getFileHandle(file.name, { create: true });
    var writable = await targetHandle.createWritable();
    await writable.write(await file.arrayBuffer());
    await writable.close();
    status.textContent = 'saved ' + file.name + ' to assets/img/';
    insertAtCursor('![' + alt + '](/assets/img/' + file.name + ')');
  } catch (err) {
    status.textContent = 'could not save image: ' + err.message + ' — not inserting a link.';
  }
}

function insertBlock(text) {
  var start = editor.selectionStart;
  var value = editor.value;
  var needsNlBefore = start > 0 && value[start - 1] !== '\n';
  var insert = (needsNlBefore ? '\n' : '') + text + '\n';

  editor.value = value.slice(0, start) + insert + value.slice(editor.selectionEnd);
  var pos = start + insert.length;
  editor.focus();
  editor.setSelectionRange(pos, pos);
  update();
}

var toolbarActions = {
  h1: function () { prefixLines('# '); },
  h2: function () { prefixLines('## '); },
  h3: function () { prefixLines('### '); },
  bold: function () { wrapSelection('**', '**', 'bold text'); },
  italic: function () { wrapSelection('*', '*', 'italic text'); },
  code: function () { wrapSelection('`', '`', 'code'); },
  link: function () { wrapSelection('[', '](url)', 'link text'); },
  image: function () { insertImage(); },
  ul: function () { prefixLines('- '); },
  quote: function () { prefixLines('> '); },
  hr: function () { insertBlock('* * *'); }
};

document.querySelectorAll('.toolbar button').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var action = toolbarActions[btn.getAttribute('data-action')];
    if (action) action();
  });
});

function slugify(s) {
  return s.trim().replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

// ---- open an existing post/project back into the tool for editing ----
function parseFrontMatter(text) {
  var m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
  if (!m) return { data: {}, body: text };

  var data = {};
  m[1].split(/\r?\n/).forEach(function (line) {
    var kv = line.match(/^(\w+):\s*(.*)$/);
    if (!kv) return;
    var val = kv[2].trim();
    if (/^".*"$/.test(val)) val = val.slice(1, -1).replace(/\\"/g, '"');
    data[kv[1]] = val;
  });

  return { data: data, body: m[2].replace(/^\r?\n/, '') };
}

async function openPost() {
  if (!window.showOpenFilePicker) {
    status.textContent = 'this browser can\'t open files directly — try Chrome or Edge.';
    return;
  }
  var picked;
  try {
    picked = await window.showOpenFilePicker({
      types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md'] } }]
    });
  } catch (err) {
    return; // user cancelled
  }

  var handle = picked[0];
  var file = await handle.getFile();
  var parsed = parseFrontMatter(await file.text());
  var data = parsed.data;

  titleInput.value = data.title || '';

  if (data.layout === 'project') {
    postType.value = 'project';
    tagInput.value = data.tag || '';
    colorInput.value = data.color || 'green';
    orderInput.value = data.order || '';
    githubInput.value = data.github || '';
  } else {
    postType.value = 'post';
    dateInput.value = data.date || new Date().toISOString().slice(0, 10);
  }
  applyTypeVisibility();

  editor.value = parsed.body.replace(/\n+$/, '');
  update();

  status.textContent = 'opened ' + handle.name + ' — "create post" will overwrite it unless you change the title.';
}

async function createPost() {
  var title = titleInput.value.trim();
  if (!title) {
    status.textContent = 'add a title first.';
    titleInput.focus();
    return;
  }
  var slug = slugify(title);
  var type = postType.value;
  var filename, frontMatter, targetDir;

  if (type === 'project') {
    var tag = tagInput.value.trim() || 'misc';
    var color = colorInput.value;
    var order = orderInput.value.trim();
    var github = githubInput.value.trim();

    filename = slug.toLowerCase() + '.md';
    targetDir = '_projects/';
    frontMatter = '---\nlayout: project\ntitle: "' + title.replace(/"/g, '\\"') + '"\ntag: ' + tag + '\ncolor: ' + color + '\n' +
      (github ? 'github: ' + github + '\n' : '') +
      (order ? 'order: ' + order + '\n' : '') +
      '---\n\n';
  } else {
    var date = dateInput.value || new Date().toISOString().slice(0, 10);
    filename = date + '-' + slug + '.md';
    targetDir = '_posts/';
    frontMatter = '---\nlayout: post\ntitle: "' + title.replace(/"/g, '\\"') + '"\ndate: ' + date + '\n---\n\n';
  }

  var content = frontMatter + editor.value + '\n';

  if (window.showDirectoryPicker && siteRootHandle) {
    try {
      var dir = await getSubDir(siteRootHandle, targetDir);
      var handle = await dir.getFileHandle(filename, { create: true });
      var writable = await handle.createWritable();
      await writable.write(content);
      await writable.close();
      status.textContent = 'saved ' + targetDir + filename;
      showToast('Saved ' + targetDir + filename);
    } catch (err) {
      status.textContent = 'error: ' + err.message;
      showToast('Could not save: ' + err.message, true);
    }
  } else if (window.showSaveFilePicker) {
    try {
      var handle2 = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md'] } }]
      });
      var writable2 = await handle2.createWritable();
      await writable2.write(content);
      await writable2.close();
      status.textContent = 'saved ' + filename + ' — make sure it landed in ' + targetDir;
      showToast('Saved ' + filename);
    } catch (err) {
      if (err.name !== 'AbortError') {
        status.textContent = 'error: ' + err.message;
        showToast('Could not save: ' + err.message, true);
      }
    }
  } else {
    var blob = new Blob([content], { type: 'text/markdown' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    status.textContent = 'downloaded ' + filename + ' — this browser can\'t choose a folder, move it into ' + targetDir + ' yourself.';
    showToast('Downloaded ' + filename);
  }
}

document.getElementById('createBtn').addEventListener('click', createPost);
document.getElementById('openBtn').addEventListener('click', openPost);
</script>
</body>
</html>
