<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blog Post Creator</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: 'Courier New', monospace;
    background: #0a0f0a;
    color: #d7f7de;
  }
  body { display: flex; flex-direction: column; height: 100vh; }
  header {
    padding: 12px 20px;
    border-bottom: 1px solid #1f8f43;
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1rem; margin: 0; color: #39ff6a; white-space: nowrap; }
  label { font-size: 0.8rem; color: #6f9c7a; display: flex; align-items: center; gap: 6px; }
  input[type=text], input[type=date] {
    background: #050e08;
    border: 1px solid #1f8f43;
    color: #d7f7de;
    font-family: inherit;
    font-size: 0.85rem;
    padding: 5px 8px;
  }
  #title { flex: 1; min-width: 200px; }
  button {
    font-family: inherit;
    font-size: 0.85rem;
    background: transparent;
    border: 1px solid #39ff6a;
    color: #39ff6a;
    padding: 6px 14px;
    cursor: pointer;
  }
  button:hover { background: #39ff6a; color: #001a06; }
  .toolbar {
    display: flex;
    gap: 6px;
    padding: 8px 20px;
    border-bottom: 1px solid #1f8f43;
    flex-wrap: wrap;
  }
  .toolbar button {
    font-size: 0.75rem;
    padding: 4px 10px;
    border-color: #6f9c7a;
    color: #d7f7de;
  }
  .toolbar button:hover { background: #6f9c7a; color: #001a06; }
  main { flex: 1; display: flex; min-height: 0; }
  .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .pane + .pane { border-left: 1px solid #1f8f43; }
  .pane-label {
    font-size: 0.7rem;
    color: #6f9c7a;
    padding: 6px 12px;
    border-bottom: 1px solid #16241a;
  }
  textarea {
    flex: 1;
    resize: none;
    border: none;
    background: #060a06;
    color: #d7f7de;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    padding: 14px;
    outline: none;
    line-height: 1.5;
  }
  #preview { flex: 1; overflow-y: auto; padding: 14px 20px; line-height: 1.6; }
  #preview h1, #preview h2, #preview h3 { color: #39ff6a; }
  #preview code { background: #0d1a0d; padding: 1px 5px; }
  #preview pre { background: #0d1a0d; padding: 10px; overflow-x: auto; }
  #preview pre code { padding: 0; }
  #preview hr { border: none; border-top: 1px dashed #1f8f43; margin: 16px 0; }
  #preview blockquote { border-left: 2px solid #1f8f43; margin: 0; padding-left: 12px; color: #6f9c7a; }
  #preview a { color: #4dd8ff; }
  #preview img { max-width: 100%; }
  #status {
    padding: 6px 20px;
    font-size: 0.75rem;
    color: #6f9c7a;
    border-top: 1px solid #16241a;
    min-height: 18px;
  }
</style>
</head>
<body>
  <header>
    <h1>blog post creator</h1>
    <label>title <input type="text" id="title" placeholder="Post Title"></label>
    <label>date <input type="date" id="date"></label>
    <button id="createBtn">create post</button>
  </header>
  <div class="toolbar">
    <button type="button" data-action="h1">H1</button>
    <button type="button" data-action="h2">H2</button>
    <button type="button" data-action="h3">H3</button>
    <button type="button" data-action="bold"><b>B</b></button>
    <button type="button" data-action="italic"><i>I</i></button>
    <button type="button" data-action="code">code</button>
    <button type="button" data-action="link">link</button>
    <button type="button" data-action="image">image</button>
    <button type="button" data-action="ul">list</button>
    <button type="button" data-action="quote">quote</button>
    <button type="button" data-action="hr">hr</button>
  </div>
  <main>
    <div class="pane">
      <div class="pane-label">markdown</div>
      <textarea id="editor" placeholder="Write your post here..." spellcheck="false"></textarea>
    </div>
    <div class="pane">
      <div class="pane-label">preview</div>
      <div id="preview"></div>
    </div>
  </main>
  <div id="status"></div>

<script>
// ---- tiny markdown renderer (just enough for these posts) ----
function renderMarkdown(src) {
  function escape(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function inline(text) {
    text = escape(text);
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    text = text.replace(/_([^_]+)_/g, '<em>$1</em>');
    text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');
    text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return text;
  }

  var lines = src.replace(/\r\n/g, '\n').split('\n');
  var html = [];
  var inCode = false, codeBuf = [];
  var listType = null, listBuf = [];

  function flushList() {
    if (listType) {
      html.push('<' + listType + '>' + listBuf.join('') + '</' + listType + '>');
      listType = null;
      listBuf = [];
    }
  }

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];

    if (/^```/.test(line)) {
      if (!inCode) { inCode = true; codeBuf = []; }
      else { html.push('<pre><code>' + escape(codeBuf.join('\n')) + '</code></pre>'); inCode = false; }
      continue;
    }
    if (inCode) { codeBuf.push(line); continue; }

    if (/^\s*$/.test(line)) { flushList(); continue; }

    var h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { flushList(); html.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'); continue; }

    if (/^(\*\s*\*\s*\*|-{3,}|_{3,})\s*$/.test(line)) { flushList(); html.push('<hr>'); continue; }

    var bq = line.match(/^>\s?(.*)$/);
    if (bq) { flushList(); html.push('<blockquote>' + inline(bq[1]) + '</blockquote>'); continue; }

    var ul = line.match(/^[-*]\s+(.*)$/);
    if (ul) {
      if (listType !== 'ul') { flushList(); listType = 'ul'; }
      listBuf.push('<li>' + inline(ul[1]) + '</li>');
      continue;
    }
    var ol = line.match(/^\d+\.\s+(.*)$/);
    if (ol) {
      if (listType !== 'ol') { flushList(); listType = 'ol'; }
      listBuf.push('<li>' + inline(ol[1]) + '</li>');
      continue;
    }

    flushList();
    html.push('<p>' + inline(line) + '</p>');
  }
  flushList();
  return html.join('\n');
}

var editor = document.getElementById('editor');
var preview = document.getElementById('preview');
var titleInput = document.getElementById('title');
var dateInput = document.getElementById('date');
var status = document.getElementById('status');

function update() { preview.innerHTML = renderMarkdown(editor.value); }
editor.addEventListener('input', update);

dateInput.value = new Date().toISOString().slice(0, 10);
update();

// ---- toolbar: wrap or prefix the current selection ----
function wrapSelection(before, after, placeholder) {
  var start = editor.selectionStart;
  var end = editor.selectionEnd;
  var value = editor.value;
  var selected = value.slice(start, end);
  var body = selected || (placeholder || '');
  var insertText = before + body + after;

  editor.value = value.slice(0, start) + insertText + value.slice(end);
  editor.focus();
  if (selected) {
    editor.setSelectionRange(start + before.length, start + before.length + selected.length);
  } else {
    editor.setSelectionRange(start + before.length, start + before.length + body.length);
  }
  update();
}

function prefixLines(prefix) {
  var start = editor.selectionStart;
  var end = editor.selectionEnd;
  var value = editor.value;
  var lineStart = value.lastIndexOf('\n', start - 1) + 1;
  var lineEnd = value.indexOf('\n', end);
  if (lineEnd === -1) lineEnd = value.length;

  var block = value.slice(lineStart, lineEnd);
  var newBlock = block.split('\n').map(function (l) { return prefix + l; }).join('\n');

  editor.value = value.slice(0, lineStart) + newBlock + value.slice(lineEnd);
  editor.focus();
  editor.setSelectionRange(lineStart, lineStart + newBlock.length);
  update();
}

function insertAtCursor(text) {
  var start = editor.selectionStart;
  var end = editor.selectionEnd;
  var value = editor.value;
  editor.value = value.slice(0, start) + text + value.slice(end);
  var pos = start + text.length;
  editor.focus();
  editor.setSelectionRange(pos, pos);
  update();
}

// images live in assets/img/ (shared across all posts), not next to the
// post file — this copies the picked file there and inserts the right path
async function insertImage() {
  if (!window.showOpenFilePicker) {
    var name = prompt('Image filename (you\'ll need to add it to assets/img/ yourself):', 'photo.png');
    if (name) insertAtCursor('![](/assets/img/' + name + ')');
    return;
  }
  var picked;
  try {
    picked = await window.showOpenFilePicker({
      types: [{ description: 'Images', accept: { 'image/*': ['.png', '.jpg', '.jpeg', '.gif', '.svg', '.webp'] } }]
    });
  } catch (err) {
    return; // user cancelled
  }
  var file = await picked[0].getFile();
  var alt = prompt('Alt text for this image:', file.name.replace(/\.[^.]+$/, '')) || '';

  try {
    var saveHandle = await window.showSaveFilePicker({ suggestedName: file.name });
    var writable = await saveHandle.createWritable();
    await writable.write(await file.arrayBuffer());
    await writable.close();
    status.textContent = 'saved a copy of ' + file.name + ' — make sure it landed in assets/img/';
  } catch (err) {
    if (err.name !== 'AbortError') status.textContent = 'could not save image copy: ' + err.message;
  }

  insertAtCursor('![' + alt + '](/assets/img/' + file.name + ')');
}

function insertBlock(text) {
  var start = editor.selectionStart;
  var value = editor.value;
  var needsNlBefore = start > 0 && value[start - 1] !== '\n';
  var insert = (needsNlBefore ? '\n' : '') + text + '\n';

  editor.value = value.slice(0, start) + insert + value.slice(editor.selectionEnd);
  var pos = start + insert.length;
  editor.focus();
  editor.setSelectionRange(pos, pos);
  update();
}

var toolbarActions = {
  h1: function () { prefixLines('# '); },
  h2: function () { prefixLines('## '); },
  h3: function () { prefixLines('### '); },
  bold: function () { wrapSelection('**', '**', 'bold text'); },
  italic: function () { wrapSelection('*', '*', 'italic text'); },
  code: function () { wrapSelection('`', '`', 'code'); },
  link: function () { wrapSelection('[', '](url)', 'link text'); },
  image: function () { insertImage(); },
  ul: function () { prefixLines('- '); },
  quote: function () { prefixLines('> '); },
  hr: function () { insertBlock('* * *'); }
};

document.querySelectorAll('.toolbar button').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var action = toolbarActions[btn.getAttribute('data-action')];
    if (action) action();
  });
});

function slugify(s) {
  return s.trim().replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

async function createPost() {
  var title = titleInput.value.trim();
  if (!title) {
    status.textContent = 'add a title first.';
    titleInput.focus();
    return;
  }
  var date = dateInput.value || new Date().toISOString().slice(0, 10);
  var slug = slugify(title);
  var filename = date + '-' + slug + '.md';

  var frontMatter = '---\nlayout: post\ntitle: "' + title.replace(/"/g, '\\"') + '"\ndate: ' + date + '\n---\n\n';
  var content = frontMatter + editor.value + '\n';

  if (window.showSaveFilePicker) {
    try {
      var handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md'] } }]
      });
      var writable = await handle.createWritable();
      await writable.write(content);
      await writable.close();
      status.textContent = 'saved ' + filename;
    } catch (err) {
      if (err.name !== 'AbortError') status.textContent = 'error: ' + err.message;
    }
  } else {
    var blob = new Blob([content], { type: 'text/markdown' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    status.textContent = 'downloaded ' + filename + ' — this browser can\'t choose a folder, move it into _posts/ yourself.';
  }
}

document.getElementById('createBtn').addEventListener('click', createPost);
</script>
</body>
</html>
